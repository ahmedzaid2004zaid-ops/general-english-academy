{"id":"R1","title":"An email, Subject: Greetings from Florida!",
"passage":"Hi, Sara.\nI'm visiting my sister in Florida. It's very warm and nice here. Every morning, I go to the beach and swim. Sometimes my sister comes home early, and we play tennis in the afternoon. And we always go for a long walk after that. I'm having a great time!\nLove,\nHeather",

{"id":"R3","title":"The Whitney Museum of American Art",
"passage":"The Whitney is one of the most famous art museums in New York City. It first opened in 1931 in Greenwich Village, and then it moved to two different places in 1954 and 1966. Since 2015, this museum of American art has been in a new building downtown. The new space is larger and more modern, and it has beautiful views of the Hudson River from its windows and café. Visit it next time you are in the city.",

{"id":"R4","title":"Is sitting unhealthy?",
"passage":"If you have been sitting in an office for a long period of time, stand up and move for your health. Research has shown that too much sitting might cause higher blood pressure, add body fat, and increase the danger of death from heart disease. Studies have also suggested that moving more has a positive effect on a person's health. So, what can an office worker do? Experts say that you should take a break from sitting every 30 minutes, stand more while working, and even walk when meeting with coworkers. Moving might save your life.",

{"id":"R5","title":"A changing neighborhood – for better or for worse?",
"passage":"Recently, an international online retailer opened an enormous, brand-new office in our neighborhood. Until then, there hadn't been any major companies or huge buildings like this in the area – just small family-owned businesses. So, obviously, there has been a lot of discussion about it lately.\nSome people say the company is creating jobs and will attract other new businesses, but others complain that most of the new jobs will be low-paying. These people also believe that rising costs will push out independent businesses and make the neighborhood too expensive for its current residents.\nI can't make up my mind whether the company will be a benefit for the neighborhood or not. It's a complicated issue, and I'm not sure there is a right or wrong answer. What do you think?",

{"n":26,"stem":"The author of the blog post believes that ____.","options":["there may be both positive and negative consequences","the changes will be helpful for most workers from the region","there will soon be many more big companies in the neighborhood","the changes will be mostly harmful for people who live in the area"],"answer":"a"},
{"n":27,"stem":"Some people think the company will help the area because it will ____.","options":["create a greater number of jobs with excellent salaries","make the area more interesting to other companies","lower the cost of living in the neighborhood","replace smaller stores with larger ones"],"answer":"b"}]},
{"id":"R6","title":"An inspiring story",
"passage":"When Alex McGovern was in high school, he used to earn money working weekends at a local bakery. After working there for several months, helping bake fresh bread and cakes, Alex noticed a familiar pattern: a huge amount of food was thrown away at the end of each day. It was food that the bakery could no longer sell, but it was still good enough to eat. So Alex began to wonder what he could do with all of this extra food.\nWith the bakery owner's permission, he reached out to a local organization that worked with families who need help with food and housing. The charity was extremely pleased and arranged to pick up the extra food each day. Now bread was no longer wasted, but generously shared with people in need.\nAlex's idea was such a success that he began approaching other local restaurants about joining the program. Before long, there were over a dozen businesses taking part, and Alex created a website to grow the program in other cities. Today Alex's \"simple\" idea is helping feed people all over the country!",
"questions":[
{"n":28,"stem":"Alex's original goal at the bakery was to ____.","options":["eat free bread and cake","learn to be a baker","make money","help people"],"answer":"c"},

{"n":31,"stem":"The extra food was ____.","options":["sold by Alex","bought by the charity","delivered by the bakery","picked up by the organization"],"answer":"d"}]},
{"id":"R7","title":"Some thoughts on your online profile",
"passage":"In many ways, the internet has made it easier than ever to find out about new job opportunities. Yet, as companies increasingly examine candidates' social media profiles for information to use in the selection process, people need to be aware of the risks and rewards of posting online. The views they express—and the ways they choose to express them—can be a crucial factor in whether or not they receive an offer of employment.\nMany young adults, who have grown up with social media and are comfortable sharing their lives online, don't realize how employers are using social media in hiring decisions. These companies don't just consider information about a person's online behavior; they may even gather information about friends and family. Some fear that employers may judge candidates based on factors such as their medical history, age, or even beliefs.\nWhile there is currently debate about what information companies are allowed to legally collect or use for hiring decisions, everyone agrees that people need to be careful about what they post online. Your behavior on social media could cost you your current position or job opportunities in the future.\nSo, should job applicants erase their social media accounts completely? According to Professor John Sacks of the Better Hiring Institute, \"It would be better to make sure you have a strong professional profile that emphasizes your qualifications. Not having any social media might send the message that you have something to hide.\" In other words, take the time to create an attractive profile on a career site and carefully consider everything you post online.",
"questions":[
{"n":32,"stem":"This article is aimed primarily at ____.","options":["employers","college students","potential job candidates","social media organizations"],"answer":"c"},
{"n":33,"stem":"According to the author, some people may not realize ____.","options":["the effect of their online behavior on friends and family","how their online profiles can affect hiring decisions","what information companies cannot legally collect","if their online profile looks professional enough"],"answer":"b"},
{"n":34,"stem":"One way of increasing your chances of getting a good job is ____.","options":["not keeping a profile online","expressing your opinions in a honest way","having a profile that clearly shows your skills","being secretive about what you share online"],"answer":"c"},
{"n":35,"stem":"The author ____ online personal information to make hiring decisions.","options":["is against companies using","is in favor of the practice of using","believes it does not matter if employers use","does not say whether it is good or bad to use"],"answer":"d"}]},
{"id":"R8","title":"Sleep deprivation",
"passage":"If you can sleep well, be grateful. Sleep deprivation is extremely common, and its side effects are both serious and underappreciated. It is estimated that 50–70 million people in the U.S. suffer from a sleep disorder, and yet too many of them do not seek medical help. Although occasional sleep interruptions are generally no more than a nuisance, continuous lack of sleep can lead to excessive daytime sleepiness, emotional difficulties, poor job performance, and even obesity.\nSleep deprivation also impacts mental well-being. A study done by the U.K. Mental Health Foundation found that people who didn't get enough sleep were about three times more likely to exhibit poor concentration and four times more likely to have relationship problems. According to another study, by the University of Warwick, getting less than six hours of sleep on a continuous basis makes a person 48% more likely to die of heart disease and 15% more likely to develop a stroke. According to study co-author Professor Francesco Cappuccio, lack of sleep \"is like a ticking time bomb for your health.\"\nIf a person is experiencing difficulties falling and staying asleep, there are several effective methods that can help and do not require medication. These include relaxation techniques, like tightening and relaxing muscles, breathing slowly, and meditating; stimulation control, which involves controlling pre-bedtime activities and surroundings; and cognitive behavioral therapy (CBT), designed to help people understand and change their thought patterns. If sleep deprivation and negative symptoms continue, however, consultation with a doctor is recommended. It's essential not to underestimate the importance of adequate sleep to maintaining good mental and physical health.",
"questions":[
{"n":36,"stem":"The main idea of the article is that ____.","options":["lack of sleep can have significant health consequences","sleeping is not as essential as people used to think","people underestimate how much sleep they need","relaxation techniques are important for a good night's sleep"],"answer":"a"},
{"n":37,"stem":"According to the article, many people with sleeping disorders ____.","options":["breathe more slowly","do cognitive behavioral therapy","do not speak to their doctor about it","usually practice healthy sleeping habits"],"answer":"c"},
{"n":38,"stem":"The article suggests that good sleepers ____.","options":["can focus better","often get about eight hours of good sleep","are able to sleep during the day","do not have heart problems"],"answer":"a"},
{"n":39,"stem":"Professor Cappuccio found that ____.","options":["sleep-deprived people have more relationship problems","sleep deprivation might make people critically ill","research from the Mental Health Foundation was incorrect","lack of sleep is just a minor nuisance"],"answer":"b"},
{"n":40,"stem":"The article says that people experiencing sleep difficulties can ____.","options":["lose some weight","take some types of medicine","immediately find medical help","try methods that help them fall and stay asleep"],"answer":"d"}]}
]},

{"n":61,"stem":"The process ____ be very time-consuming before they launched the new system.","options":["might","would","ought to","used to"],"answer":"d"},
{"n":62,"stem":"After some time together, those on John's team learned not to underestimate ____.","options":["each other","himself","another","itself"],"answer":"a"},
{"n":63,"stem":"The man next door asked me ____ keep an eye on his apartment while he was away.","options":["I can","would I","if I could","whether will I"],"answer":"c"},
{"n":64,"stem":"Our niece is very hardworking and determined. She has never had any trouble ____ her exams.","options":["to pass","passing","passed","pass"],"answer":"b"},
{"n":65,"stem":"If they ____ the damage more carefully, they would have found these other problems.","options":["would assess","had assessed","have assessed","would have assessed"],"answer":"b"},
{"n":66,"stem":"By this time next Monday, ____ a new head of the sales department.","options":["we hire","we're hiring","we'll have hired","we have been hiring"],"answer":"c"},
{"n":67,"stem":"The consultants proposed a number of alternatives, ____ the firm disregarded.","options":["much of what","many of which","some of whom","none of whose"],"answer":"b"},
{"n":68,"stem":"What ____ a couple of relaxing days at an unspoiled beach.","options":["they actually plan","did they actually plan","they actually planned was","have they actually planned are"],"answer":"c"},
{"n":69,"stem":"We felt genuinely shocked. Never again ____ at such an overrated place.","options":["ate we","we will eat","did eat we","would we eat"],"answer":"d"},
{"n":70,"stem":"Authorities recommend that everyone ____ the highway until repairs are completed.","options":["avoid","avoided","would avoid","is going to avoid"],"answer":"a"}
]}]}
]};

var SPEAKING = {
  title: "Section IV: Speaking",
  directions: "Record one answer of about one to two minutes. Speak naturally. There is no right or wrong content, we want to hear how you use English.",
  prompt: "Tell us about yourself and your daily life. Then describe something interesting you did recently, and say what you would like to do next year.",
  points: ["Who you are, where you live, and what you do every day.", "A recent experience: what happened, where, and who was there.", "A plan or hope for next year, and why it matters to you."]
};

var root = document.getElementById("evolve-test");
var sections = DATA.sections;
var STEP_LABELS = ["Listening", "Reading", "Language", "Speaking", "Results"];
var RESULTS = 4, SPEAK = 3;
var state = { step: 0, name: "", started: false, answers: {}, finished: false, filter: "all",
  speaking: { blob: null, url: null, seconds: 0, mime: "", recording: false, error: "" }, upload: "" };
var rec = { mr: null, stream: null, chunks: [], t0: 0, tick: null };

function $(sel) { return root.querySelector(sel); }
function allQuestions(sec) { return sec.groups.reduce(function (a, g) { return a.concat(g.questions); }, []); }
function secScore(sec) { return allQuestions(sec).filter(function (q) { return state.answers[q.n] === q.answer; }).length; }
function totalScore() { return sections.reduce(function (s, sec) { return s + secScore(sec); }, 0); }
function levelFor(score) { var h = DATA.scoring.filter(function (b) { return score >= b.min && score <= b.max; })[0]; return h ? h.level : "Level 1A"; }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]; }); }
function fmt(sec) { sec = Math.round(sec); return Math.floor(sec / 60) + ":" + ("0" + (sec % 60)).slice(-2); }

/* ---------- shell ---------- */
root.innerHTML =
  '<div class="et-top"><div class="et-brand"><b>EVOLVE Placement Test</b><span class="et-who"></span></div>' +
  '<div class="et-steps"></div><div class="et-bar"><i></i></div></div>' +
  '<div class="et-main"></div>' +
  '<div class="et-foot"><div class="in"><span class="count"></span><span><button class="btn ghost et-back">Back</button> <button class="btn et-next">Next</button></span></div></div>';

function renderSteps() {
  var h = STEP_LABELS.map(function (t, i) {
    var dis = !state.started || (i === RESULTS && !state.finished) || (state.finished && i < RESULTS);
    return '<button data-i="' + i + '"' + (i === state.step ? ' aria-current="step"' : "") + (dis ? " disabled" : "") + ">" + t + "</button>";
  }).join("");
  var box = $(".et-steps"); box.innerHTML = h;
  Array.prototype.forEach.call(box.querySelectorAll("button"), function (b) { b.onclick = function () { go(+b.getAttribute("data-i")); }; });
  $(".et-who").textContent = state.name;
  $(".et-bar i").style.width = (Object.keys(state.answers).length / DATA.total_items * 100) + "%";
}
function go(i) { stopRecording(true); state.step = i; render(); root.scrollIntoView({ block: "start" }); }

/* ---------- questions ---------- */
function questionHTML(q, review) {
  var chosen = state.answers[q.n], letters = ["a", "b", "c", "d"];
  var opts = q.options.map(function (o, i) {
    var L = letters[i], cls = "opt", tag = "";
    if (review) {
      cls += " locked";
      if (L === q.answer) { cls += " correct"; tag = chosen === L ? "Your answer ✓" : "Correct answer"; }
      else if (L === chosen) { cls += " wrong"; tag = "Your answer ✗"; }
    }
    return '<label class="' + cls + '"><input type="radio" name="q' + q.n + '" value="' + L + '"' + (chosen === L ? " checked" : "") + (review ? " disabled" : "") + '>' +
      '<span class="l">' + L + "</span><span>" + esc(o) + "</span>" + (tag ? '<span class="tag">' + tag + "</span>" : "") + "</label>";
  }).join("");
  var miss = review && !chosen ? '<p class="muted" style="margin:4px 0 0">Not answered.</p>' : "";
  return '<div class="q"><div class="qstem"><span class="qn">' + q.n + "</span><span>" +
    esc(q.stem).replace(/____/g, "<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>") + "</span></div>" + opts + miss + "</div>";
}
function groupHTML(g, idx, review, listening) {
  var h = '<div class="card">';
  if (listening) h += '<p class="group-title">Situation ' + (idx + 1) + '</p><div class="situation">' + esc(g.situation) + "</div>";
  else if (g.title) h += '<p class="group-title">' + esc(g.title) + "</p>";
  if (g.passage) h += '<div class="passage" style="margin-bottom:10px">' + esc(g.passage) + "</div>";
  h += g.questions.map(function (q) { return questionHTML(q, review); }).join("");
  return h + "</div>";
}

/* ---------- screens ---------- */
function renderIntro() {
  $(".et-main").innerHTML =
    "<h1>Find your English level</h1>" +
    '<p class="muted">' + DATA.total_items + " multiple-choice questions in three sections (Listening, Reading, Language Use), followed by a short speaking task. It takes about an hour.</p>" +
    '<div class="card"><label class="field" for="et-nm">Your name</label>' +
    '<input type="text" id="et-nm" autocomplete="name" value="' + esc(state.name) + '">' +
    '<p class="muted" style="margin-top:12px">Before you start:</p>' +
    '<ul style="margin:0 0 12px;padding-left:20px"><li>Use headphones and find a quiet place.</li><li>You hear each listening conversation only once.</li><li>For the speaking task, allow your microphone when your browser asks.</li></ul>' +
    '<button class="btn et-go">Start the test</button></div>';
  $(".et-go").onclick = function () {
    var v = $("#et-nm").value.trim();
    if (!v) { $("#et-nm").focus(); return; }
    state.name = v; state.started = true; go(0);
  };
  $("#et-nm").onkeydown = function (e) { if (e.key === "Enter") $(".et-go").click(); };
}

function bindRadios() {
  Array.prototype.forEach.call($(".et-main").querySelectorAll("input[type=radio]"), function (r) {
    r.onchange = function () { state.answers[+r.name.slice(1)] = r.value; renderCount(); renderSteps(); };
  });
}

function renderSection(i) {
  var sec = sections[i];
  var h = "<h2>" + esc(sec.title) + '</h2><p class="muted">' + esc(sec.directions) + " Suggested time: " + sec.time_limit_minutes + " minutes.</p>";
  if (sec.id === "listening") {
    h += '<div class="card"><h3>1. Directions</h3><p class="muted" style="margin:0">Press play and listen to the directions and the example.</p>' +
      '<audio id="et-aDir" controls preload="metadata" controlsList="nodownload" src="' + esc(CONFIG.AUDIO_DIRECTIONS_URL) + '"></audio>' +
      '<p class="audio-note">Example: the Science Museum and the hospital are on the same street (answer d).</p></div>' +
      '<div class="card"><h3>2. Listening test</h3><p class="muted" style="margin:0">Press play when you are ready. The recording runs for about 17 minutes without stopping, so read each situation as it is announced.</p>' +
      '<audio id="et-aTest" controls preload="metadata" controlsList="nodownload" src="' + esc(CONFIG.AUDIO_TEST_URL) + '"></audio>' +
      '<p class="audio-note" id="et-aNote">Answer the questions below while you listen.</p></div>';
  }
  sec.groups.forEach(function (g, idx) { h += groupHTML(g, idx, false, sec.id === "listening"); });
  $(".et-main").innerHTML = h;
  bindRadios();
  if (sec.id === "listening") {
    var dir = $("#et-aDir"), test = $("#et-aTest");
    dir.onended = function () { $("#et-aNote").textContent = "Directions finished. Press play on the listening test."; };
    test.onended = function () { $("#et-aNote").textContent = "The recording has finished. Check your answers, then continue."; };
    test.onplay = function () { if (!dir.paused) dir.pause(); };
    dir.onplay = function () { if (!test.paused) test.pause(); };
    var onErr = function (e) { $("#et-aNote").innerHTML = '<span style="color:var(--bad)">The audio file could not be loaded. Tell your teacher.</span>'; };
    dir.onerror = onErr; test.onerror = onErr;
  }
}

/* ---------- speaking ---------- */
function pickMime() {
  if (!window.MediaRecorder) return "";
  var c = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus"];
  for (var i = 0; i < c.length; i++) if (MediaRecorder.isTypeSupported(c[i])) return c[i];
  return "";
}
function renderSpeaking() {
  var s = state.speaking, supported = !!(navigator.mediaDevices && window.MediaRecorder);
  var h = "<h2>" + SPEAKING.title + '</h2><p class="muted">' + SPEAKING.directions + "</p>" +
    '<div class="card"><p class="prompt">' + esc(SPEAKING.prompt) + "</p>" +
    '<ul class="prompt-list">' + SPEAKING.points.map(function (p) { return "<li>" + esc(p) + "</li>"; }).join("") + "</ul>" +
    '<p class="muted" style="margin:0">Aim for at least ' + CONFIG.SPEAKING_MIN_SECONDS + " seconds. Recording stops automatically at " + fmt(CONFIG.SPEAKING_MAX_SECONDS) + ".</p></div>" +
    '<div class="card" id="et-rec">';
  if (!supported) {
    h += '<div class="warn">Your browser cannot record audio. Open this page in a recent version of Chrome, Edge, Firefox, or Safari, or tell your teacher.</div>';
  } else if (s.recording) {
    h += '<div><span class="dot"></span><b>Recording</b></div><div class="timer" id="et-time">0:00</div>' +
      '<button class="btn" id="et-stop">Stop recording</button>';
  } else if (s.blob) {
    h += '<h3>Your recording (' + fmt(s.seconds) + ')</h3><audio controls src="' + s.url + '"></audio>' +
      (s.seconds < CONFIG.SPEAKING_MIN_SECONDS ? '<p class="audio-note" style="color:var(--bad)">This is quite short. Try to speak for at least ' + CONFIG.SPEAKING_MIN_SECONDS + " seconds.</p>" : "") +
      '<p style="margin-top:12px"><button class="btn ghost" id="et-again">Record again</button></p>';
  } else {
    h += '<button class="btn rec" id="et-start">Start recording</button><p class="audio-note">Your browser will ask for permission to use the microphone.</p>';
  }
  if (s.error) h += '<div class="warn">' + esc(s.error) + "</div>";
  h += "</div>";
  $(".et-main").innerHTML = h;
  var st = $("#et-start"), sp = $("#et-stop"), ag = $("#et-again");
  if (st) st.onclick = startRecording;
  if (sp) sp.onclick = function () { stopRecording(false); };
  if (ag) ag.onclick = function () { if (s.url) URL.revokeObjectURL(s.url); s.blob = null; s.url = null; s.seconds = 0; s.error = ""; renderSpeaking(); };
}
function startRecording() {
  var s = state.speaking; s.error = "";
  navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
    var mime = pickMime(), opts = mime ? { mimeType: mime } : undefined;
    rec.stream = stream; rec.chunks = [];
    rec.mr = new MediaRecorder(stream, opts);
    s.mime = rec.mr.mimeType || mime || "audio/webm";
    rec.mr.ondataavailable = function (e) { if (e.data && e.data.size) rec.chunks.push(e.data); };
    rec.mr.onstop = function () {
      stream.getTracks().forEach(function (t) { t.stop(); });
      clearInterval(rec.tick);
      var keep = !rec.discard; rec.discard = false;
      s.recording = false;
      if (keep && rec.chunks.length) {
        s.blob = new Blob(rec.chunks, { type: s.mime });
        s.url = URL.createObjectURL(s.blob);
        s.seconds = (Date.now() - rec.t0) / 1000;
      }
      if (state.step === SPEAK) renderSpeaking();
      renderCount();
    };
    rec.t0 = Date.now(); rec.mr.start(); s.recording = true; renderSpeaking();
    rec.tick = setInterval(function () {
      var el = (Date.now() - rec.t0) / 1000, t = $("#et-time");
      if (t) t.textContent = fmt(el);
      if (el >= CONFIG.SPEAKING_MAX_SECONDS) stopRecording(false);
    }, 250);
  }).catch(function () {
    s.error = "The microphone is blocked. Allow microphone access in your browser settings, then press Start recording again.";
    renderSpeaking();
  });
}
function stopRecording(discard) {
  if (rec.mr && rec.mr.state !== "inactive") { rec.discard = !!discard; rec.mr.stop(); }
}

/* ---------- results ---------- */
function renderResults() {
  var total = totalScore(), lvl = levelFor(total), answered = Object.keys(state.answers).length, s = state.speaking;
  var h = "<h1>Your result</h1>" +
    '<div class="card"><p class="muted" style="margin:0">' + esc(state.name) + "</p>" +
    '<div class="score">' + total + '<span class="muted" style="font-size:22px;font-weight:600"> / ' + DATA.total_items + "</span></div>" +
    '<div class="level">Recommended placement: ' + esc(lvl) + "</div>" +
    '<table class="sec"><tr><th>Section</th><th>Score</th></tr>' +
    sections.map(function (x) { return "<tr><td>" + esc(x.title.replace(/^Section [IV]+: /, "")) + "</td><td>" + secScore(x) + " / " + allQuestions(x).length + "</td></tr>"; }).join("") +
    "<tr><td>Speaking</td><td>" + (s.blob ? "Recorded, reviewed by your teacher" : "Not recorded") + "</td></tr></table>" +
    (answered < DATA.total_items ? '<div class="warn">' + (DATA.total_items - answered) + " question(s) were left blank and count as incorrect.</div>" : "") +
    (state.upload ? '<p class="audio-note">' + esc(state.upload) + "</p>" : "") +
    '<div class="filters noprint" style="margin-top:14px"><button class="btn ghost et-print">Print result</button> <button class="btn ghost et-retake">Retake the test</button></div></div>';
  if (s.blob) h += '<div class="card"><h3>Your speaking recording</h3><audio controls src="' + s.url + '"></audio></div>';
  h += "<h2>Review your answers</h2>" +
    '<div class="filters noprint"><button class="btn ' + (state.filter === "all" ? "" : "ghost") + '" data-f="all">All questions</button>' +
    '<button class="btn ' + (state.filter === "wrong" ? "" : "ghost") + '" data-f="wrong">Only mistakes</button></div>';
  sections.forEach(function (sec) {
    sec.groups.forEach(function (g, idx) {
      var qs = g.questions.filter(function (q) { return state.filter === "all" || state.answers[q.n] !== q.answer; });
      if (!qs.length) return;
      var copy = {}; for (var k in g) copy[k] = g[k]; copy.questions = qs;
      h += groupHTML(copy, idx, true, sec.id === "listening");
    });
  });
  $(".et-main").innerHTML = h;
  $(".et-print").onclick = function () { window.print(); };
  $(".et-retake").onclick = function () {
    if (confirm("Delete your answers and recording and start again?")) {
      if (s.url) URL.revokeObjectURL(s.url);
      state.answers = {}; state.finished = false; state.filter = "all"; state.upload = "";
      state.speaking = { blob: null, url: null, seconds: 0, mime: "", recording: false, error: "" };
      go(0);
    }
  };
  Array.prototype.forEach.call($(".et-main").querySelectorAll("[data-f]"), function (b) {
    b.onclick = function () { state.filter = b.getAttribute("data-f"); renderResults(); };
  });
}

/* ---------- submit ---------- */
function report() {
  var total = totalScore(), s = state.speaking, secs = {};
  sections.forEach(function (x) { secs[x.id] = secScore(x); });
  var copy = {}; for (var k in state.answers) copy[k] = state.answers[k];
  return { type: "evolve-placement-result", name: state.name, score: total, outOf: DATA.total_items, level: levelFor(total),
    sections: secs, answers: copy, speaking: { recorded: !!s.blob, seconds: Math.round(s.seconds), mimeType: s.mime, audio: s.blob || null },
    date: new Date().toISOString() };
}
function finish() {
  var blank = DATA.total_items - Object.keys(state.answers).length, msg = [];
  if (blank > 0) msg.push(blank + " question(s) are still blank.");
  if (!state.speaking.blob) msg.push("You have not recorded the speaking task.");
  if (msg.length && !confirm(msg.join(" ") + " Submit anyway?")) return;
  state.finished = true;
  var r = report();
  try { root.dispatchEvent(new CustomEvent("evolve:result", { detail: r, bubbles: true })); } catch (e) {}
  try { if (typeof window.onEvolveResult === "function") window.onEvolveResult(r); } catch (e) {}
  try { if (window.parent && window.parent !== window) window.parent.postMessage(r, "*"); } catch (e) {}
  if (CONFIG.SPEAKING_UPLOAD_URL) {
    var fd = new FormData();
    fd.append("name", r.name); fd.append("score", r.score); fd.append("level", r.level);
    fd.append("sections", JSON.stringify(r.sections)); fd.append("answers", JSON.stringify(r.answers));
    if (state.speaking.blob) fd.append("speaking", state.speaking.blob, "speaking." + (state.speaking.mime.indexOf("mp4") > -1 ? "m4a" : "webm"));
    state.upload = "Sending your result…";
    fetch(CONFIG.SPEAKING_UPLOAD_URL, { method: "POST", body: fd })
      .then(function (res) { state.upload = res.ok ? "Your result and recording were sent." : "Your result could not be sent. Tell your teacher."; if (state.step === RESULTS) renderResults(); })
      .catch(function () { state.upload = "Your result could not be sent. Tell your teacher."; if (state.step === RESULTS) renderResults(); });
  }
  go(RESULTS);
}

/* ---------- main render ---------- */
function renderCount() {
  var c = $(".count");
  if (!state.started || state.step === RESULTS) { c.textContent = ""; return; }
  if (state.step === SPEAK) { c.textContent = state.speaking.blob ? "Recording saved" : "Not recorded yet"; return; }
  var qs = allQuestions(sections[state.step]);
  c.textContent = qs.filter(function (q) { return state.answers[q.n]; }).length + " of " + qs.length + " answered";
}
function render() {
  renderSteps(); renderCount();
  var f = $(".et-foot");
  if (!state.started) { f.classList.add("hidden"); renderIntro(); return; }
  if (state.step === RESULTS) { f.classList.add("hidden"); renderResults(); return; }
  f.classList.remove("hidden");
  if (state.step === SPEAK) renderSpeaking(); else renderSection(state.step);
  $(".et-back").classList.toggle("hidden", state.step === 0);
  $(".et-next").textContent = state.step === SPEAK ? "Submit test" : "Next section";
  $(".et-back").onclick = function () { go(state.step - 1); };
  $(".et-next").onclick = function () {
    if (state.speaking.recording) { alert("Stop the recording first."); return; }
    if (state.step === SPEAK) finish(); else go(state.step + 1);
  };
}
render();
})();
</script>
